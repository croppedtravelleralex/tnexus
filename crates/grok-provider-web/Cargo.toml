[package]
name = "grok-provider-web"
version.workspace = true
edition.workspace = true

[dependencies]
grok-domain = { path = "../grok-domain" }
grok-egress = { path = "../grok-egress" }
grok-conversation = { path = "../grok-conversation" }
grok-pool = { path = "../grok-pool" }
grok-audit = { path = "../grok-audit" }
grok-image-pipeline = { path = "../grok-image-pipeline" }
grok-signer = { path = "../grok-signer" }

async-trait = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "0.26"

[dev-dependencies]
futures = { workspace = true }
axum = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
