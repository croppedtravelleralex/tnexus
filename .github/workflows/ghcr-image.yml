name: Build and push TNexus image

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/croppedtravelleralex/tnexus:latest
            ghcr.io/croppedtravelleralex/tnexus:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE=https://tnexus.relai.asia
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.account-ops
          push: true
          tags: |
            ghcr.io/croppedtravelleralex/tnexus-account-ops:latest
            ghcr.io/croppedtravelleralex/tnexus-account-ops:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/croppedtravelleralex/tnexus-gateway:latest
            ghcr.io/croppedtravelleralex/tnexus-gateway:${{ github.sha }}

      # Grok subsystem (grok2api-rs) — built only once crates/grok2api-rs exists
      # (hashFiles is '' until the crate lands, so this step is a no-op pre-G0-P6).
      - name: Build and push grok2api-rs image
        if: hashFiles('crates/grok2api-rs/Cargo.toml') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.grok
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/grok2api-rs:latest
            ghcr.io/${{ github.repository_owner }}/grok2api-rs:${{ github.sha }}

  grok-gate:
    # Grok migration gate (docs/39c §7 CI): cargo tests for grok crates + gate g0.
    # Graceful when grok crates are absent (pre-G0), matching grok_migration_gate.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # 与仓库根 rust-toolchain.toml（channel 1.97）对齐：本地 rustc 1.97.1。
          # 镜像构建（Dockerfile*）仍用 rust:1.94-bookworm，不受本 pin 影响。
          toolchain: 1.97.1
          components: rustfmt
      - name: Cargo test grok crates (when present)
        run: |
          set -euo pipefail
          pkgs=""
          for p in grok-domain grok-storage grok2api-rs grok-egress grok-conversation grok-pool \
                   grok-audit grok-provider-web grok-ops grok-gateway grok-chrome-ticket \
                   grok-provider-build grok-provider-console grok-admin grok-accountsync; do
            if [ -f "crates/$p/Cargo.toml" ]; then pkgs="$pkgs -p $p"; fi
          done
          if [ -n "$pkgs" ]; then
            cargo test $pkgs
          else
            echo "No grok crates yet (pre-G0) — skipping cargo test"
          fi
      - name: Grok migration gate g0
        run: bash ./scripts/grok_migration_gate.sh g0
      - name: Grok migration gate g3
        # G3 全量（pool/ops crate 测试；dispatch diff<5% 属运行验收 G3-A2，不在门禁内）
        run: bash ./scripts/grok_migration_gate.sh g3
