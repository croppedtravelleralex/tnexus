[workspace]
resolver = "2"
members = [
    "crates/tnexus-accounts-db",
    "crates/tnexus-domain",
    "crates/tnexus-auth",
    "crates/tnexus-storage",
    "crates/tnexus-api",
    "crates/tnexus-worker",
    "crates/protocol",
    "crates/helper_client",
    "crates/gateway-auth",
    "crates/upstream",
    "crates/upstream-probe",
    "crates/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
async-stream = "0.3"
aws-config = "1"
aws-sdk-s3 = "1"
aws-credential-types = "1"
axum = { version = "0.8", features = ["macros", "json", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
jsonwebtoken = "9"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
bytes = "1"
futures-util = "0.3"
cookie = "0.18"
rusqlite = { version = "0.32", features = ["bundled"] }
wreq = "6.0.0-rc"
wreq-util = "3.0.0-rc"
regex = "1"
sha3 = "0.10"
hex = "0.4"
http-body-util = "0.1"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tnexus-accounts-db = { path = "crates/tnexus-accounts-db" }
tnexus-auth = { path = "crates/tnexus-auth" }
tnexus-domain = { path = "crates/tnexus-domain" }
tnexus-storage = { path = "crates/tnexus-storage" }
protocol = { path = "crates/protocol" }
helper_client = { path = "crates/helper_client" }
gateway-auth = { path = "crates/gateway-auth" }
upstream = { path = "crates/upstream" }
