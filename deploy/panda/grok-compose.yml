# Grok sidecar stack — see docs/39-grok2api-rust-migration.md §8
# 禁止在 Panda 构建。发布：CI → GHCR → grok-deploy.sh / grok-bootstrap.sh

services:
  grok2api-rs:
    image: ghcr.io/${GHCR_OWNER:-croppedtravelleralex}/grok2api-rs:${GROK_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    environment:
      GROK2API_ADDR: ${GROK2API_ADDR:-0.0.0.0:8000}
      GROK_ADMIN_LISTEN: ${GROK_ADMIN_LISTEN:-0.0.0.0:8091}
      GROK_DATABASE_URL: ${GROK_DATABASE_URL:?required}
      GROK_REDIS_URL: ${GROK_REDIS_URL:-redis://127.0.0.1:6380}
      GROK_CREDENTIAL_KEY: ${GROK_CREDENTIAL_KEY:-}
      GROK_GATEWAY_AUTH_KEY: ${GROK_GATEWAY_AUTH_KEY:?required}
      GROK_ADMIN_SECRET: ${GROK_ADMIN_SECRET:?required}
      GROK_ADMIN_USERNAME: ${GROK_ADMIN_USERNAME:-admin}
      GROK_ADMIN_PASSWORD: ${GROK_ADMIN_PASSWORD:?required}
      GROK2API_DIRECT: ${GROK2API_DIRECT:-1}
      GROK2API_BROWSER_BRIDGE_URL: ${GROK2API_BROWSER_BRIDGE_URL:-http://127.0.0.1:8192}
      GROK_IMAGE_ENABLED: ${GROK_IMAGE_ENABLED:-1}
      GROK_UPSTREAM_PROXY: ${GROK_UPSTREAM_PROXY:-}
      GROK_LOCAL_PROXY: ${GROK_LOCAL_PROXY:-}
      RUST_LOG: ${GROK_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  browser-bridge:
    image: ghcr.io/${GHCR_OWNER:-croppedtravelleralex}/grok-browser-bridge:${GROK_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    profiles: ["bridge"]
    environment:
      LOG_LEVEL: ${GROK_BRIDGE_LOG:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8192/health"]
      interval: 60s
      timeout: 5s
      retries: 3
