# Grok sidecar stack — see docs/39-grok2api-rust-migration.md §8
# 禁止在 Panda 构建。发布：CI → GHCR → grok-deploy.sh / grok-bootstrap.sh

services:
  grok2api-rs:
    image: ghcr.io/${GHCR_OWNER:-croppedtravelleralex}/grok2api-rs:${GROK_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    environment:
      GROK2API_ADDR: ${GROK2API_ADDR:-0.0.0.0:8000}
      GROK_ADMIN_LISTEN: ${GROK_ADMIN_LISTEN:-0.0.0.0:8091}
      GROK_DATABASE_URL: ${GROK_DATABASE_URL:?required}
      GROK_REDIS_URL: ${GROK_REDIS_URL:-redis://127.0.0.1:6380}
      GROK_CREDENTIAL_KEY: ${GROK_CREDENTIAL_KEY:-}
      GROK_GATEWAY_AUTH_KEY: ${GROK_GATEWAY_AUTH_KEY:?required}
      GROK_ADMIN_SECRET: ${GROK_ADMIN_SECRET:?required}
      GROK_ADMIN_USERNAME: ${GROK_ADMIN_USERNAME:-admin}
      GROK_ADMIN_PASSWORD: ${GROK_ADMIN_PASSWORD:?required}
      GROK2API_DIRECT: ${GROK2API_DIRECT:-1}
      GROK2API_BROWSER_BRIDGE_URL: ${GROK2API_BROWSER_BRIDGE_URL:-http://127.0.0.1:8192}
      GROK2API_SIGNER_MODE: ${GROK2API_SIGNER_MODE:-native}
      GROK_STATSIG_FINGERPRINT: ${GROK_STATSIG_FINGERPRINT:-}
      GROK2API_PROXY_LIST: ${GROK2API_PROXY_LIST:-${GROK_UPSTREAM_PROXY:-}}
      GROK2API_PROXY_FILE: ${GROK2API_PROXY_FILE:-}
      GROK_IMAGE_ENABLED: ${GROK_IMAGE_ENABLED:-1}
      GROK_IMAGINE_LITE: ${GROK_IMAGINE_LITE:-1}
      GROK_IMAGINE_TIMEOUT_SECS: ${GROK_IMAGINE_TIMEOUT_SECS:-120}
      GROK_IMAGE_GLOBAL_CONCURRENCY: ${GROK_IMAGE_GLOBAL_CONCURRENCY:-2}
      GROK_IMAGE_RETRY_MAX: ${GROK_IMAGE_RETRY_MAX:-3}
      GROK_IMAGE_LEASE_SECS: ${GROK_IMAGE_LEASE_SECS:-120}
      GROK_OCR_GLOBAL_CONCURRENCY: ${GROK_OCR_GLOBAL_CONCURRENCY:-4}
      GROK_CHAT_RETRY_MAX: ${GROK_CHAT_RETRY_MAX:-3}
      GROK_UPSTREAM_PROXY: ${GROK_UPSTREAM_PROXY:-}
      GROK_LOCAL_PROXY: ${GROK_LOCAL_PROXY:-}
      GROK_PURE_HTTP_KEYS_DIR: ${GROK_PURE_HTTP_KEYS_DIR:-/opt/tnexus/pure_http_keys}
      GROK_TASKS_ENABLED: ${GROK_TASKS_ENABLED:-1}
      GROK_NURTURE_ENABLED: ${GROK_NURTURE_ENABLED:-1}
      GROK_NURTURE_INTERVAL_SECS: ${GROK_NURTURE_INTERVAL_SECS:-480}
      GROK_QUOTA_INTERVAL_MS: ${GROK_QUOTA_INTERVAL_MS:-60000}
      GROK_QUOTA_BATCH_LIMIT: ${GROK_QUOTA_BATCH_LIMIT:-32}
      RUST_LOG: ${GROK_LOG:-info}
    volumes:
      - ${GROK_PURE_HTTP_KEYS_DIR:-/opt/tnexus/pure_http_keys}:${GROK_PURE_HTTP_KEYS_DIR:-/opt/tnexus/pure_http_keys}:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  browser-bridge:
    image: ghcr.io/${GHCR_OWNER:-croppedtravelleralex}/grok-browser-bridge:${GROK_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    profiles: ["bridge"]
    environment:
      LOG_LEVEL: ${GROK_BRIDGE_LOG:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8192/health"]
      interval: 60s
      timeout: 5s
      retries: 3
