# TNexus gateway on Panda :8014 — scheduling_gate + upstream.
# After postgres cutover: ACCOUNTS_BACKEND=postgres in /opt/tnexus/.env (no gptimage sqlite mount).
services:
  gateway:
    image: ${TNEXUS_GATEWAY_IMAGE:-ghcr.io/croppedtravelleralex/tnexus-gateway:latest}
    network_mode: host
    env_file:
      - /opt/tnexus/.env
      - /root/gptimage-gateway-rs/secrets/gateway.env
    environment:
      PIN_ACCOUNT_FILE: /secrets/pin_account.json
      SCHEDULING_STATE_FILE: /data/pool/scheduling_state.json
      PIPELINE_EVENTS_FILE: /data/pool/pipeline_events.ndjson
      GATEWAY_LISTEN: 0.0.0.0:8014
      AUTH_DB_PATH: /data/pool/gateway_auth.db
      IMAGE_ENABLED: "1"
      IMAGE_GLOBAL_CONCURRENCY: "10"
      IMAGE_ACCOUNT_INFLIGHT_MAX: "1"
      IMAGE_BINDING_INFLIGHT_MAX: "1"
      IMAGE_DISPATCH_INTERVAL_MS: "800"
      IMAGE_ADMIN_RETRY_MAX: "5"
      IMAGE_SS_SLOT_CAP: "2"
      IMAGE_ACCOUNT_SLOT_CAP: "1"
      IMAGE_SLOT_TTL_SECS: "600"
      IMAGE_READY_BUFFER_MAX_BYTES: "536870912"
      IMAGE_READY_BUFFER_MAX_ITEMS: "32"
      IMAGE_RETURN_WINDOW_MAX: "8"
      IMAGE_COOLDOWN_RATE_LIMIT_SECS: "900"
      IMAGE_COOLDOWN_TERMINAL_SECS: "1800"
      IMAGE_SUBMIT_WORKERS: "10"
      IMAGE_SYNC_ADAPTER: "1"
      IMAGE_SYNC_ADAPTER_TIMEOUT_SECS: "900"
      IMAGE_POISSON_LAMBDA: "8"
      IMAGE_WORKLOAD_RIMG_BOOST: "0.15"
      IMAGE_WORKLOAD_IMAGE_RESERVE_PCT: "0.70"
      IMAGE_RUNTIME_CONFIG_FILE: "/data/pool/image_runtime.json"
      IMAGE_RUNTIME_POLL_SECS: "30"
      IMAGE_DEADLOCK_CPU_TRIP_PCT: "90"
      IMAGE_DEADLOCK_WINDOW_SECS: "60"
      IMAGE_DEADLOCK_TRIP_COOLDOWN_SECS: "120"
      IMAGE_CF_BINDING_COOLDOWN_SECS: "900"
      IMAGE_PIPELINE_STALL_SECS: "180"
      IMAGE_PIPELINE_TRIP_COOLDOWN_SECS: "60"
      IMAGE_PRE_TICKET_TTL_SECS: "120"
      HUMANLIKE_EPSILON: "0.12"
      # Measured successful generations reach 407s (p99≈349s); 300s cut off
      # requests that would have succeeded.
      UPSTREAM_IMAGE_POLL_TIMEOUT_SECS: "420"
      UPSTREAM_IMAGE_POLL_INITIAL_WAIT_SECS: "5"
      UPSTREAM_IMAGE_POLL_INTERVAL_SECS: "3"
      UPSTREAM_IMAGE_POLL_SETTLE_SECS: "2"
      UPSTREAM_IMAGE_POLL_CHECK_BEFORE_HIT: "1"
      DATA_PLANE: upstream
    volumes:
      - /opt/tnexus/data/pool:/data/pool:rw
      - /opt/tnexus/data/images:/data/images:rw
      - /root/gptimage-gateway-rs/secrets/pin_account.json:/secrets/pin_account.json:ro
    restart: unless-stopped
