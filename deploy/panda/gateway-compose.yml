# TNexus gateway on Panda :8014 — scheduling_gate + upstream.
# Shares live gptimage accounts.db with :8012 (WAL + transactional writes).
services:
  gateway:
    image: ${TNEXUS_GATEWAY_IMAGE:-ghcr.io/croppedtravelleralex/tnexus-gateway:latest}
    network_mode: host
    env_file:
      - /opt/tnexus/.env
      - /root/gptimage-gateway-rs/secrets/gateway.env
    environment:
      ACCOUNTS_DB: /gptimage/data/accounts.db
      PIN_ACCOUNT_FILE: /secrets/pin_account.json
      SCHEDULING_STATE_FILE: /data/pool/scheduling_state.json
      PIPELINE_EVENTS_FILE: /data/pool/pipeline_events.ndjson
      GATEWAY_LISTEN: 0.0.0.0:8014
      IMAGE_ENABLED: "1"
      IMAGE_GLOBAL_CONCURRENCY: "0"
      IMAGE_ACCOUNT_INFLIGHT_MAX: "0"
      DATA_PLANE: upstream
    volumes:
      - /opt/tnexus/data/pool:/data/pool:rw
      - /root/gptimage/data:/gptimage/data:rw
      - /root/gptimage-gateway-rs/secrets/pin_account.json:/secrets/pin_account.json:ro
    restart: unless-stopped
