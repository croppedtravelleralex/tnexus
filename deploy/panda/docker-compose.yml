services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tnexus
    volumes:
      - /opt/tnexus/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /opt/tnexus/data/redis:/data

  api:
    image: ${TNEXUS_IMAGE}
    command: tnexus-api
    restart: unless-stopped
    env_file: /opt/tnexus/.env
    network_mode: host
    depends_on:
      - postgres
      - redis

  worker:
    image: ${TNEXUS_IMAGE}
    command: tnexus-worker
    restart: unless-stopped
    env_file: /opt/tnexus/.env
    network_mode: host
    depends_on:
      - postgres
      - redis
