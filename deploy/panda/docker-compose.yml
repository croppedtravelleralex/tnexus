services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tnexus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /opt/tnexus/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - /opt/tnexus/data/redis:/data

  account-ops:
    image: ${TNEXUS_ACCOUNT_OPS_IMAGE:-ghcr.io/croppedtravelleralex/tnexus-account-ops:latest}
    restart: unless-stopped
    env_file: /opt/tnexus/.env
    network_mode: host
    volumes:
      - /opt/tnexus/data/pool:/data/pool:rw
    # Rust account-ops: OAuth + refresh + nurture/outlook/quota-prime workers

  api:
    image: ${TNEXUS_IMAGE}
    command: tnexus-api
    restart: unless-stopped
    env_file: /opt/tnexus/.env
    network_mode: host
    volumes:
      - /opt/tnexus/data/pool:/data/pool:rw
      - /opt/tnexus/data/images:/data/images:rw
    depends_on:
      - postgres
      - redis
      - account-ops

  worker:
    image: ${TNEXUS_IMAGE}
    command: tnexus-worker
    restart: unless-stopped
    env_file: /opt/tnexus/.env
    network_mode: host
    volumes:
      - /opt/tnexus/data/pool:/data/pool:rw
      - /opt/tnexus/data/images:/data/images:rw
    depends_on:
      - postgres
      - redis
