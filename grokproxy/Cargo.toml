[package]
name = "grokproxy"
version = "0.1.0"
edition = "2021"
# wreq (BoringSSL) sets the floor; see src/xai/mod.rs for why it is required.
rust-version = "1.85"
description = "Minimal Grok account pool: ingest, refresh, schedule, serve an OpenAI-compatible API"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "socks",
    "stream",
    "gzip",
] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rand = "0.8"
time = { version = "0.3", features = ["formatting", "macros"] }
wreq = { version = "5.3.0", features = ["cookies", "json", "gzip", "brotli"] }
wreq-util = "2.2.6"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
