<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grokProxy 号池</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d12; --panel:#141821; --panel2:#1a1f2b; --line:#252b38;
    --text:#e8eaf0; --muted:#8b93a5; --dim:#5d6675;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
  button,input,select{font:inherit;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);padding:8px 12px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  button{cursor:pointer;transition:border-color .12s,background .12s}
  button:hover:not(:disabled){border-color:#3d4657;background:#212736}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:#6b4ce6}

  header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{font-size:16px;font-weight:650;letter-spacing:.4px}
  .logo span{color:var(--accent)}
  .spacer{flex:1}
  .muted{color:var(--muted);font-size:13px}

  main{padding:20px 24px;max-width:1400px;margin:0 auto}

  /* gate */
  #gate{max-width:420px;margin:14vh auto;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:28px}
  #gate h2{margin:0 0 6px;font-size:17px}
  #gate p{margin:0 0 18px;color:var(--muted);font-size:13px}
  #gate .row{display:flex;gap:10px}
  #gate input{flex:1}

  .cards{display:grid;gap:12px;margin-bottom:18px;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:#39415260}
  .card.sel{border-color:var(--accent)}
  .card .n{font-size:25px;font-weight:650;font-variant-numeric:tabular-nums}
  .card .k{color:var(--muted);font-size:12px;margin-top:2px}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input[type=search]{min-width:230px}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);
    white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.5px;
    text-transform:uppercase;background:var(--panel2)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#171c26}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.email{max-width:280px;overflow:hidden;text-overflow:ellipsis}
  td.err{max-width:320px;overflow:hidden;text-overflow:ellipsis;
    color:var(--muted);font-size:12px}

  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
    border:1px solid transparent}
  .active{color:var(--ok);border-color:#1f6f2e;background:#0f2a15}
  .cooling{color:var(--warn);border-color:#6b4c10;background:#2a1f08}
  .needs_reauth{color:var(--bad);border-color:#7a2620;background:#2a1210}
  .forbidden{color:#ff9d7a;border-color:#7a4020;background:#2a1a10}
  .disabled{color:var(--dim);border-color:#3a4150;background:#1a1e27}

  .unverified{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;
    color:var(--dim);border:1px solid #3a4150;background:#161a22;margin-right:4px}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
    border-radius:10px;padding:11px 15px;margin-bottom:16px;color:var(--muted);font-size:13px}
  .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;
    margin-top:14px;color:var(--muted);font-size:13px}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:10px;padding:12px 16px;max-width:440px;font-size:13px;
    box-shadow:0 8px 28px #0008;white-space:pre-line}
  .toast.err{border-left-color:var(--bad)}
  .toast.ok{border-left-color:var(--ok)}
  .hidden{display:none!important}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff40;
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="gate">
  <h2>grokProxy 号池</h2>
  <p>输入 admin key。仅保存在本页会话中，关闭标签即失效。</p>
  <div class="row">
    <input id="gateKey" type="password" placeholder="admin key" autocomplete="off">
    <button class="primary" id="gateGo">进入</button>
  </div>
  <p id="gateMsg" class="muted" style="margin-top:12px"></p>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo">grok<span>Proxy</span></div>
    <span class="muted" id="poolLine">—</span>
    <div class="spacer"></div>
    <button id="btnRefresh">刷新</button>
    <button id="btnSweep" title="批量刷新 token，把已吊销的号移出调度">体检</button>
    <button id="btnQuota" title="真发一次 chat，看哪些号还有额度">额度探测</button>
    <button id="btnLogout">退出</button>
  </header>

  <main>
    <div class="note">
      「可用」只表示导入后未被判死，<b>不等于能用</b>；带「未验证」标记的号从未成功服务过请求。
      点「体检」批量刷新 token 清掉吊销号，点「额度探测」真发 chat 确认权益。
      上游没有配额接口（<code>/usage</code>、<code>/credits</code>、<code>/quota</code> 均 404），
      所以只能统计<b>已用</b> token 与花费，无法显示剩余额度。
    </div>
    <div class="cards" id="cards"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="搜索邮箱…">
      <select id="provider">
        <option value="">全部通道</option>
        <option value="build">Build</option>
        <option value="web">Web</option>
      </select>
      <select id="pageSize">
        <option value="50">每页 50</option>
        <option value="100">每页 100</option>
        <option value="200">每页 200</option>
      </select>
      <span class="muted" id="filterHint"></span>
    </div>

    <table>
      <thead><tr>
        <th>邮箱</th><th>通道</th><th>状态</th><th>模型</th>
        <th class="num">成功</th><th class="num">失败</th>
        <th class="num">剩余额度</th><th class="num">已用 token</th><th class="num">花费 $</th>
        <th>最近使用</th><th>最近错误</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="pager">
      <span id="pageInfo">—</span>
      <button id="prev">上一页</button>
      <button id="next">下一页</button>
    </div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const $ = (id) => document.getElementById(id);
const LABEL = {active:'可用', cooling:'冷却中', needs_reauth:'需重新授权',
               forbidden:'权益拒绝', disabled:'已停用'};
const ORDER = ['active','cooling','needs_reauth','forbidden','disabled'];

const state = { key:'', offset:0, limit:50, health:'', provider:'', search:'', total:0 };
let searchTimer = null;

function toast(message, kind) {
  const el = $('toast');
  el.textContent = message;
  el.className = 'toast' + (kind ? ' ' + kind : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), kind === 'err' ? 9000 : 5000);
}

async function api(path, options) {
  const response = await fetch(path, {
    ...options,
    headers: { Authorization: 'Bearer ' + state.key, ...(options?.headers || {}) },
  });
  if (response.status === 401) throw new Error('admin key 不正确');
  if (!response.ok) throw new Error('HTTP ' + response.status);
  return response.json();
}

function when(ts) {
  if (!ts) return '—';
  const d = Math.floor(Date.now() / 1000) - ts;
  if (d < 60) return d + ' 秒前';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  return Math.floor(d / 86400) + ' 天前';
}

async function loadStats() {
  const stats = await api('/api/v1/stats');
  const totals = {};
  let grand = 0;
  for (const provider of Object.keys(stats)) {
    for (const [health, n] of Object.entries(stats[provider] || {})) {
      totals[health] = (totals[health] || 0) + n;
      grand += n;
    }
  }
  $('poolLine').textContent =
    `build ${sum(stats.build)} · web ${sum(stats.web)} · 合计 ${grand}`;
  $('cards').innerHTML = ORDER.map((h) => `
    <div class="card ${state.health === h ? 'sel' : ''}" data-health="${h}">
      <div class="n ${h}">${totals[h] || 0}</div>
      <div class="k">${LABEL[h]}</div>
    </div>`).join('');
  for (const card of document.querySelectorAll('.card')) {
    card.onclick = () => {
      state.health = state.health === card.dataset.health ? '' : card.dataset.health;
      state.offset = 0;
      refresh();
    };
  }
}

function sum(group) {
  return Object.values(group || {}).reduce((a, b) => a + b, 0);
}

// The upstream advertises an entitlement in its response headers but never
// counts it down, so remaining = entitlement − what we have spent locally.
// Both halves only exist once the account has served at least one request.
function quota(a) {
  const total = a.limit_tokens;
  if (!total) return '<span class="muted" title="上游只在响应头里报额度，账号跑过请求后才知道">未知</span>';
  const left = Math.max(0, total - (a.total_tokens || 0));
  const pct = Math.round((left / total) * 100);
  const colour = left === 0 ? '#dc2626' : pct < 20 ? '#d97706' : '#16a34a';
  return `<span style="color:${colour}" title="剩余 ${left.toLocaleString()} / 授权 ${total.toLocaleString()} token">`
    + `${(left / 1000).toFixed(0)}k <span class="muted">(${pct}%)</span></span>`;
}

async function loadRows() {
  const params = new URLSearchParams({ limit: state.limit, offset: state.offset });
  if (state.health) params.set('health', state.health);
  if (state.provider) params.set('provider', state.provider);
  if (state.search) params.set('search', state.search);
  const data = await api('/api/v1/accounts?' + params);
  state.total = data.total;

  $('rows').innerHTML = data.accounts.map((a) => `
    <tr>
      <td class="email" title="${a.email}">
        ${a.verified ? '' : '<span class="unverified" title="从未成功服务过请求，仅是导入状态">未验证</span> '}${a.email}
      </td>
      <td>${a.provider}</td>
      <td><span class="pill ${a.health}">${LABEL[a.health] || a.health}</span></td>
      <td>${a.last_model || '—'}</td>
      <td class="num">${a.success_count}</td>
      <td class="num">${a.failure_count}</td>
      <td class="num">${quota(a)}</td>
      <td class="num">${a.total_tokens ? a.total_tokens.toLocaleString() : '—'}</td>
      <td class="num">${a.cost_usd ? a.cost_usd.toFixed(4) : '—'}</td>
      <td>${when(a.last_used_at)}</td>
      <td class="err" title="${(a.last_error || '').replace(/"/g, '&quot;')}">${a.last_error || ''}</td>
      <td><button data-id="${a.id}" data-to="${a.health === 'disabled' ? 'active' : 'disabled'}">
        ${a.health === 'disabled' ? '启用' : '停用'}</button></td>
    </tr>`).join('') || '<tr><td colspan="12" class="muted">没有匹配的账号</td></tr>';

  for (const button of $('rows').querySelectorAll('button[data-id]')) {
    button.onclick = async () => {
      button.disabled = true;
      try {
        await api(`/api/v1/accounts/${button.dataset.id}/health`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ health: button.dataset.to }),
        });
        await refresh();
      } catch (err) { toast(String(err.message || err), 'err'); button.disabled = false; }
    };
  }

  const from = state.total ? state.offset + 1 : 0;
  const to = Math.min(state.offset + state.limit, state.total);
  $('pageInfo').textContent = `${from}–${to} / ${state.total}`;
  $('prev').disabled = state.offset <= 0;
  $('next').disabled = to >= state.total;
  $('filterHint').textContent = state.health ? `已筛选：${LABEL[state.health]}（点卡片取消）` : '';
}

async function refresh() {
  try {
    await Promise.all([loadStats(), loadRows()]);
  } catch (err) {
    toast(String(err.message || err), 'err');
    if (String(err.message).includes('admin key')) logout();
  }
}

async function runJob(button, label, path) {
  const original = button.textContent;
  button.disabled = true;
  button.innerHTML = '<span class="spin"></span>' + label + '中';
  toast(label + '已开始，账号多时可能要几分钟…');
  try {
    const data = await api(path, { method: 'POST' });
    const r = data.report || {};
    const parts = Object.entries(r)
      .filter(([, v]) => typeof v === 'number' ? v > 0 : Boolean(v))
      .map(([k, v]) => `${k}=${v}`);
    toast(label + '完成\n' + (parts.join('  ') || '无变化'), 'ok');
    await refresh();
  } catch (err) {
    toast(label + '失败：' + (err.message || err), 'err');
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}

function enter(key) {
  state.key = key;
  sessionStorage.setItem('gp_key', key);
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  refresh();
}

function logout() {
  state.key = '';
  sessionStorage.removeItem('gp_key');
  $('app').classList.add('hidden');
  $('gate').classList.remove('hidden');
}

$('gateGo').onclick = async () => {
  const key = $('gateKey').value.trim();
  if (!key) { $('gateMsg').textContent = '请输入 admin key'; return; }
  $('gateMsg').textContent = '校验中…';
  // Validate before entering so a wrong key never lands on an empty dashboard.
  try {
    const response = await fetch('/api/v1/stats', { headers: { Authorization: 'Bearer ' + key } });
    if (response.status === 401) { $('gateMsg').textContent = 'admin key 不正确'; return; }
    if (!response.ok) { $('gateMsg').textContent = '服务异常 HTTP ' + response.status; return; }
    $('gateMsg').textContent = '';
    enter(key);
  } catch (err) {
    $('gateMsg').textContent = '无法连接服务：' + err;
  }
};
$('gateKey').onkeydown = (e) => { if (e.key === 'Enter') $('gateGo').click(); };

$('btnRefresh').onclick = () => refresh();
$('btnLogout').onclick = () => logout();
$('btnSweep').onclick = (e) =>
  runJob(e.currentTarget, '体检', '/api/v1/sweep?limit=200&concurrency=8');
$('btnQuota').onclick = (e) =>
  runJob(e.currentTarget, '额度探测', '/api/v1/quota?limit=40&concurrency=4');

$('search').oninput = (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value.trim();
    state.offset = 0;
    refresh();
  }, 300);
};
$('provider').onchange = (e) => { state.provider = e.target.value; state.offset = 0; refresh(); };
$('pageSize').onchange = (e) => { state.limit = +e.target.value; state.offset = 0; refresh(); };
$('prev').onclick = () => { state.offset = Math.max(0, state.offset - state.limit); refresh(); };
$('next').onclick = () => { state.offset += state.limit; refresh(); };

// Restore a key from this tab's session; never auto-fire an unauthenticated
// request, which is what made the old page open on an error message.
const saved = sessionStorage.getItem('gp_key');
if (saved) enter(saved); else $('gateKey').focus();
</script>
</body>
</html>
