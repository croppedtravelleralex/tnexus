<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grokProxy 号池</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d12; --panel:#141821; --panel2:#1a1f2b; --line:#252b38;
    --text:#e8eaf0; --muted:#8b93a5; --dim:#5d6675;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
  button,input,select{font:inherit;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);padding:8px 12px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  button{cursor:pointer;transition:border-color .12s,background .12s}
  button:hover:not(:disabled){border-color:#3d4657;background:#212736}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:#6b4ce6}

  header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{font-size:16px;font-weight:650;letter-spacing:.4px}
  .logo span{color:var(--accent)}
  .spacer{flex:1}
  .muted{color:var(--muted);font-size:13px}

  main{padding:20px 24px;max-width:1400px;margin:0 auto}

  /* gate */
  #gate{max-width:420px;margin:14vh auto;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:28px}
  #gate h2{margin:0 0 6px;font-size:17px}
  #gate p{margin:0 0 18px;color:var(--muted);font-size:13px}
  #gate .row{display:flex;gap:10px}
  #gate input{flex:1}

  .tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:9px 20px;cursor:pointer;color:var(--muted);border:none;background:none;
    border-bottom:2px solid transparent;border-radius:0;font-weight:500}
  .tab:hover{color:var(--text);background:none;border-color:transparent}
  .tab.sel{color:var(--text);border-bottom-color:var(--accent)}
  .tab .n{color:var(--dim);font-variant-numeric:tabular-nums;margin-left:6px;font-size:13px}
  .tab.sel .n{color:var(--accent)}

  .budget{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:14px}
  .budget .hero .lab{display:block;margin-bottom:4px}
  .budget .hero b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-.4px;color:var(--ok);line-height:1.1}
  .budget b{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
  .budget .lab{color:var(--muted);font-size:12px;margin-right:6px}
  .bar{height:8px;background:#1c2230;border-radius:999px;overflow:hidden;min-width:200px}
  .bar>i{display:block;height:100%;background:var(--ok);border-radius:999px}
  .break{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    flex-basis:100%;margin-top:4px}
  .break .muted{font-size:12px;margin-top:2px}

  .cards{display:grid;gap:12px;margin-bottom:18px;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:#39415260}
  .card.sel{border-color:var(--accent)}
  .card .n{font-size:25px;font-weight:650;font-variant-numeric:tabular-nums}
  .card .k{color:var(--muted);font-size:12px;margin-top:2px}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input[type=search]{min-width:230px}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);
    white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.5px;
    text-transform:uppercase;background:var(--panel2)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#171c26}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.email{max-width:280px;overflow:hidden;text-overflow:ellipsis}
  td.err{max-width:320px;overflow:hidden;text-overflow:ellipsis;
    color:var(--muted);font-size:12px}

  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
    border:1px solid transparent}
  .active{color:var(--ok);border-color:#1f6f2e;background:#0f2a15}
  .cooling{color:var(--warn);border-color:#6b4c10;background:#2a1f08}
  .needs_reauth{color:var(--bad);border-color:#7a2620;background:#2a1210}
  .forbidden{color:#ff9d7a;border-color:#7a4020;background:#2a1a10}
  .disabled{color:var(--dim);border-color:#3a4150;background:#1a1e27}

  .unverified{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;
    color:var(--dim);border:1px solid #3a4150;background:#161a22;margin-right:4px}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
    border-radius:10px;padding:11px 15px;margin-bottom:16px;color:var(--muted);font-size:13px}
  .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;
    margin-top:14px;color:var(--muted);font-size:13px}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:10px;padding:12px 16px;max-width:440px;font-size:13px;
    box-shadow:0 8px 28px #0008;white-space:pre-line}
  .toast.err{border-left-color:var(--bad)}
  .toast.ok{border-left-color:var(--ok)}
  .hidden{display:none!important}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff40;
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="gate">
  <h2>grokProxy 号池</h2>
  <p>输入 admin key。仅保存在本页会话中，关闭标签即失效。</p>
  <div class="row">
    <input id="gateKey" type="password" placeholder="admin key" autocomplete="off">
    <button class="primary" id="gateGo">进入</button>
  </div>
  <p id="gateMsg" class="muted" style="margin-top:12px"></p>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo">grok<span>Proxy</span></div>
    <span class="muted" id="poolLine">—</span>
    <div class="spacer"></div>
    <button id="btnRefresh">刷新</button>
    <button id="btnSweep" title="只刷新已探测号的 token，把已吊销的号删掉">体检</button>
    <button id="btnQuota" title="对可调度未探测号真发一次 chat，补额度；禁聊号会删掉">额度探测</button>
    <button id="btnPurge" title="删除需重新授权、禁聊、以及没有可用 Build 的 Web 号">清理死号</button>
    <button id="btnLogout">退出</button>
  </header>

  <main>
    <div class="tabs" id="tabs"></div>
    <div class="note" id="note"></div>
    <div class="budget" id="budget"></div>
    <div class="cards" id="cards"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="搜索邮箱…">
      <select id="pageSize">
        <option value="50">每页 50</option>
        <option value="100">每页 100</option>
        <option value="200">每页 200</option>
      </select>
      <span class="muted" id="filterHint"></span>
    </div>

    <table>
      <thead><tr>
        <th>邮箱</th><th>状态</th><th>模型</th>
        <th class="num">成功</th><th class="num">失败</th>
        <th class="num">剩余额度</th><th class="num">已用 token</th><th class="num">花费 $</th>
        <th>最近使用</th><th>最近错误</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="pager">
      <span id="pageInfo">—</span>
      <button id="prev">上一页</button>
      <button id="next">下一页</button>
    </div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const $ = (id) => document.getElementById(id);
const LABEL = {active:'可用', cooling:'冷却中', needs_reauth:'需重新授权',
               forbidden:'权益拒绝', disabled:'已停用'};
const ORDER = ['active','cooling','needs_reauth','forbidden','disabled'];

// Build and Web are separate pools with separate quota models, so the page
// always shows exactly one of them. A combined count was only ever confusing.
const PROVIDERS = ['build', 'web'];
const state = { key:'', offset:0, limit:50, health:'', provider:'build', search:'', total:0,
                stats:{} };
let searchTimer = null;

function toast(message, kind) {
  const el = $('toast');
  el.textContent = message;
  el.className = 'toast' + (kind ? ' ' + kind : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), kind === 'err' ? 9000 : 5000);
}

async function api(path, options) {
  const response = await fetch(path, {
    ...options,
    headers: { Authorization: 'Bearer ' + state.key, ...(options?.headers || {}) },
  });
  if (response.status === 401) throw new Error('admin key 不正确');
  if (!response.ok) throw new Error('HTTP ' + response.status);
  return response.json();
}

function when(ts) {
  if (!ts) return '—';
  const d = Math.floor(Date.now() / 1000) - ts;
  if (d < 60) return d + ' 秒前';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  return Math.floor(d / 86400) + ' 天前';
}

const NOTE = {
  build: '总可用额度 = 可调度号上已确认的剩余 + 尚未探测的<strong>可调度</strong>号按典型授权估算。'
       + '需重新授权 / 禁聊的号不计入探测，也不会进调度。'
       + '上游 chat 响应头里的额度<b>不会递减</b>，所以已确认剩余用「授权 − 本地累计已用」计算。'
       + '点「额度探测」会真发一次 chat；禁聊 / 吊销的号会自动删掉。',
  web:  'Web 号走 grok.com 的 SSO cookie，<b>没有 token 授权额度这一说</b>，'
       + '上游按对话次数在自己的窗口内限流，因此这里不显示剩余额度，只统计实际用量。',
};

function fmt(n) {
  if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + ' 万';
  return n.toLocaleString();
}

async function loadStats() {
  state.stats = await api('/api/v1/stats');
  const mine = state.stats[state.provider] || {};
  const health = mine.health || {};
  const quota = mine.quota || {};
  const total = Object.values(health).reduce((a, b) => a + b, 0);

  $('tabs').innerHTML = PROVIDERS.map((p) => {
    const n = Object.values(state.stats[p]?.health || {}).reduce((a, b) => a + b, 0);
    const label = p === 'build' ? 'Build' : 'Web';
    return `<button class="tab ${p === state.provider ? 'sel' : ''}" data-p="${p}">`
         + `${label}<span class="n">${n}</span></button>`;
  }).join('');
  for (const tab of $('tabs').querySelectorAll('.tab')) {
    tab.onclick = () => {
      if (tab.dataset.p === state.provider) return;
      state.provider = tab.dataset.p;
      state.health = ''; state.offset = 0;
      refresh();
    };
  }

  $('note').innerHTML = NOTE[state.provider];
  const sched = state.stats.scheduler || {};
  const schedBit = (sched.in_flight || sched.queued)
    ? ` · 调度中 ${sched.in_flight || 0} / 队列 ${sched.queued || 0}` : '';
  $('poolLine').textContent = `${state.provider} · ${total} 个号 · 可调度 ${health.active || 0}${schedBit}`;

  // Only Build has an entitlement to report against.
  if (state.provider === 'build') {
    const measured = quota.measured_accounts || 0;
    const unmeasuredN = quota.schedulable_unmeasured || 0;
    const typical = quota.typical_entitlement || 1000000;
    const confirmed = quota.schedulable_remaining || 0;
    const estimated = quota.estimated_available || 0;
    const projected = unmeasuredN * typical;
    const cooling = quota.cooling_remaining || 0;
    const entitled = quota.entitled_tokens || 0;
    const spent = quota.spent_tokens || 0;
    const pct = entitled ? Math.min(100, Math.round(spent / entitled * 1000) / 10) : 0;
    $('budget').classList.remove('hidden');
    $('budget').innerHTML = `
      <div class="hero">
        <span class="lab">总可用额度</span>
        <b>${fmt(estimated)}</b>
        <span class="muted"> token</span>
      </div>
      <div style="flex:1;min-width:220px">
        <div class="bar" title="已探测号的已用 / 已授权"><i style="width:${pct}%"></i></div>
        <div class="muted" style="margin-top:6px">已探测已用 ${fmt(spent)} / 已授权 ${fmt(entitled)}（${pct}%）</div>
      </div>
      <div class="break">
        <div><span class="lab">已确认剩余</span><b>${fmt(confirmed)}</b>
          <div class="muted">${measured} 个已探测号</div></div>
        <div><span class="lab">未探测预估</span><b>${fmt(projected)}</b>
          <div class="muted">${unmeasuredN} 个可调度号 × ${fmt(typical)}</div></div>
        ${cooling > 0 ? `<div><span class="lab">冷却中</span><b>${fmt(cooling)}</b>
          <div class="muted">窗口过后再回到可调度</div></div>` : ''}
        <div><span class="lab">累计花费</span><b>$${(quota.cost_usd || 0).toFixed(2)}</b>
          <div class="muted">${fmt(spent)} token 已用</div></div>
      </div>`;
  } else {
    $('budget').innerHTML = `
      <div><span class="lab">已用</span><b>${fmt(quota.spent_tokens || 0)}</b>
        <span class="muted"> token · $${(quota.cost_usd || 0).toFixed(2)}</span></div>
      <div class="muted">Web 通道没有可查询的额度上限</div>`;
  }

  $('cards').innerHTML = ORDER.map((h) => `
    <div class="card ${state.health === h ? 'sel' : ''}" data-health="${h}">
      <div class="n ${h}">${health[h] || 0}</div>
      <div class="k">${LABEL[h]}</div>
    </div>`).join('');
  for (const card of document.querySelectorAll('.card')) {
    card.onclick = () => {
      state.health = state.health === card.dataset.health ? '' : card.dataset.health;
      state.offset = 0;
      refresh();
    };
  }
}

// Remaining = entitlement − local spend. The upstream advertises the
// entitlement in a response header but never counts it down, and only does so
// on a real chat call, so an account that has never run shows as unmeasured.
function quotaCell(a) {
  if (a.provider !== 'build') return '<span class="muted" title="Web 号没有 token 授权额度">—</span>';
  const total = a.limit_tokens;
  if (total == null || total <= 0) {
    return '<span class="muted" title="该号还没跑过请求，上游只在 chat 响应头里报额度；'
         + '点顶部「额度探测」可批量补上">未探测</span>';
  }
  const left = Math.max(0, total - (a.total_tokens || 0));
  const pct = Math.round((left / total) * 100);
  const colour = left === 0 ? 'var(--bad)' : pct < 20 ? 'var(--warn)' : 'var(--ok)';
  return `<span style="color:${colour}" title="剩余 ${left.toLocaleString()} / 授权 ${total.toLocaleString()} token">`
    + `${fmt(left)} <span class="muted">(${pct}%)</span></span>`;
}

async function loadRows() {
  const params = new URLSearchParams({ limit: state.limit, offset: state.offset });
  if (state.health) params.set('health', state.health);
  if (state.provider) params.set('provider', state.provider);
  if (state.search) params.set('search', state.search);
  const data = await api('/api/v1/accounts?' + params);
  state.total = data.total;

  $('rows').innerHTML = data.accounts.map((a) => `
    <tr>
      <td class="email" title="${a.email}">
        ${a.verified ? '' : '<span class="unverified" title="从未成功服务过请求，仅是导入状态">未验证</span> '}${a.email}
      </td>
      <td><span class="pill ${a.health}">${LABEL[a.health] || a.health}</span></td>
      <td>${a.last_model || '—'}</td>
      <td class="num">${a.success_count}</td>
      <td class="num">${a.failure_count}</td>
      <td class="num">${quotaCell(a)}</td>
      <td class="num">${a.total_tokens ? a.total_tokens.toLocaleString() : '—'}</td>
      <td class="num">${a.cost_usd ? a.cost_usd.toFixed(4) : '—'}</td>
      <td>${when(a.last_used_at)}</td>
      <td class="err" title="${(a.last_error || '').replace(/"/g, '&quot;')}">${a.last_error || ''}</td>
      <td><button data-id="${a.id}" data-to="${a.health === 'disabled' ? 'active' : 'disabled'}">
        ${a.health === 'disabled' ? '启用' : '停用'}</button></td>
    </tr>`).join('') || '<tr><td colspan="11" class="muted">没有匹配的账号</td></tr>';

  for (const button of $('rows').querySelectorAll('button[data-id]')) {
    button.onclick = async () => {
      button.disabled = true;
      try {
        await api(`/api/v1/accounts/${button.dataset.id}/health`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ health: button.dataset.to }),
        });
        await refresh();
      } catch (err) { toast(String(err.message || err), 'err'); button.disabled = false; }
    };
  }

  const from = state.total ? state.offset + 1 : 0;
  const to = Math.min(state.offset + state.limit, state.total);
  $('pageInfo').textContent = `${from}–${to} / ${state.total}`;
  $('prev').disabled = state.offset <= 0;
  $('next').disabled = to >= state.total;
  $('filterHint').textContent = state.health ? `已筛选：${LABEL[state.health]}（点卡片取消）` : '';
}

async function refresh() {
  try {
    await Promise.all([loadStats(), loadRows()]);
  } catch (err) {
    toast(String(err.message || err), 'err');
    if (String(err.message).includes('admin key')) logout();
  }
}

async function runJob(button, label, path) {
  const original = button.textContent;
  button.disabled = true;
  button.innerHTML = '<span class="spin"></span>' + label + '中';
  toast(label + '已开始，账号多时可能要几分钟…');
  try {
    const data = await api(path, { method: 'POST' });
    const r = data.report || {};
    const parts = Object.entries(r)
      .filter(([, v]) => typeof v === 'number' ? v > 0 : Boolean(v))
      .map(([k, v]) => `${k}=${v}`);
    toast(label + '完成\n' + (parts.join('  ') || '无变化'), 'ok');
    await refresh();
  } catch (err) {
    toast(label + '失败：' + (err.message || err), 'err');
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}

function enter(key) {
  state.key = key;
  sessionStorage.setItem('gp_key', key);
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  refresh();
}

function logout() {
  state.key = '';
  sessionStorage.removeItem('gp_key');
  $('app').classList.add('hidden');
  $('gate').classList.remove('hidden');
}

$('gateGo').onclick = async () => {
  const key = $('gateKey').value.trim();
  if (!key) { $('gateMsg').textContent = '请输入 admin key'; return; }
  $('gateMsg').textContent = '校验中…';
  // Validate before entering so a wrong key never lands on an empty dashboard.
  try {
    const response = await fetch('/api/v1/stats', { headers: { Authorization: 'Bearer ' + key } });
    if (response.status === 401) { $('gateMsg').textContent = 'admin key 不正确'; return; }
    if (!response.ok) { $('gateMsg').textContent = '服务异常 HTTP ' + response.status; return; }
    $('gateMsg').textContent = '';
    enter(key);
  } catch (err) {
    $('gateMsg').textContent = '无法连接服务：' + err;
  }
};
$('gateKey').onkeydown = (e) => { if (e.key === 'Enter') $('gateGo').click(); };

$('btnRefresh').onclick = () => refresh();
$('btnLogout').onclick = () => logout();
$('btnSweep').onclick = (e) =>
  runJob(e.currentTarget, '体检', '/api/v1/sweep?limit=200&concurrency=8');
$('btnQuota').onclick = (e) =>
  runJob(e.currentTarget, '额度探测', '/api/v1/quota?limit=80&concurrency=8');
$('btnPurge').onclick = async (e) => {
  const button = e.currentTarget;
  const original = button.textContent;
  button.disabled = true;
  try {
    const data = await api('/api/v1/purge', { method: 'POST' });
    toast('已删除 ' + (data.deleted || 0) + ' 个不能用的号', 'ok');
    await refresh();
  } catch (err) {
    toast('清理失败：' + (err.message || err), 'err');
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
};

$('search').oninput = (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value.trim();
    state.offset = 0;
    refresh();
  }, 300);
};
$('pageSize').onchange = (e) => { state.limit = +e.target.value; state.offset = 0; refresh(); };
$('prev').onclick = () => { state.offset = Math.max(0, state.offset - state.limit); refresh(); };
$('next').onclick = () => { state.offset += state.limit; refresh(); };

// Restore a key from this tab's session; never auto-fire an unauthenticated
// request, which is what made the old page open on an error message.
const saved = sessionStorage.getItem('gp_key');
if (saved) enter(saved); else $('gateKey').focus();
</script>
</body>
</html>
