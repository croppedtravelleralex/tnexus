# grokpool.closeapi.top -> grokProxy admin UI + admin API on 127.0.0.1:8110
#
# Only the management surface is published. /v1/* stays private: newapi and any
# other consumer reach it over loopback, so there is no reason to give the
# account pool a public inference endpoint.

server {
    listen 10.3.0.7:80;
    server_name grokpool.closeapi.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 10.3.0.7:443 ssl http2;
    server_name grokpool.closeapi.top;

    ssl_certificate /etc/letsencrypt/live/grokpool.closeapi.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grokpool.closeapi.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The pool's inference endpoint is deliberately not exposed here.
    location ^~ /v1/ {
        default_type application/json;
        return 404 '{"error":{"message":"grokProxy /v1 is loopback-only; use it from panda or an SSH tunnel.","type":"not_exposed"}}';
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8110/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A pool sweep refreshes hundreds of accounts in one request.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
